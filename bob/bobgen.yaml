psql:
  schemas:
    - public
  driver: github.com/jackc/pgx/v5/stdlib

plugins_preset: all

types:
  uuid.UUID:
    imports:
      - '"github.com/google/uuid"'

replacements:
  - match:
      type: "uuid.UUID"
    replace: "uuid.UUID"

plugins:
  models:
    pkgname: models
    destination: models
  factory:
    pkgname: factory
    destination: factory
  queries:
    pkgname: queries
    destination: queries